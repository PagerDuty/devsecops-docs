
# netlify.toml — devsecops.pagerduty.com
# This site now only redirects to docs.pagerduty.com/ops-guides/devsecops.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# These are attached to the 301 responses too. Referrer-Policy matters here:
# a redirect response's Referrer-Policy is applied to the follow-up request,
# so "same-origin" would strip the referrer when the browser goes on to
# docs.pagerduty.com (cross-origin), and docs analytics would lose the
# original traffic source (Google, blogs, Slack, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Redirects — first match wins. Keep the catch-all LAST.
# force = true is required because the old MkDocs build output (if still
# deployed) would otherwise shadow these rules.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "https://docs.pagerduty.com/ops-guides/devsecops"
  status = 301
  force = true

[[redirects]]
  from = "/introduction/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops/introduction"
  status = 301
  force = true

[[redirects]]
  from = "/terminology/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops/security-terminology"
  status = 301
  force = true

[[redirects]]
  from = "/culture/building_empathy/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops/building-empathy"
  status = 301
  force = true

[[redirects]]
  from = "/culture/team_interactions/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops/team-interactions"
  status = 301
  force = true

[[redirects]]
  from = "/implement/shift_left/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops/shift-security-left"
  status = 301
  force = true

[[redirects]]
  from = "/implement/training/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops/training-and-education"
  status = 301
  force = true

[[redirects]]
  from = "/secure_sdlc/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops/secure-sdlc"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops/resources"
  status = 301
  force = true

# Catch-all: assets, sitemap.xml, search index, /culture/, /implement/,
# unknown/mistyped URLs
[[redirects]]
  from = "/*"
  to = "https://docs.pagerduty.com/ops-guides/devsecops"
  status = 301
  force = true
